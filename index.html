<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanze Marco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Stile "videogioco di carta": fogli ritagliati con bordo d'inchiostro e ombra piena sotto (effetto 3D) */
  :root {
    --sfondo: #f1e4c8; --foglio: #fffaf0; --foglio2: #fbefd9; --inchiostro: #2b2735; --tenue: #6b6475;
    --spesa: #e8553d; --entrata: #2a9d6f; --risparmio: #3b7dd8; --sole: #ffc93c; --sole2: #ffb020;
    --ok: #2a9d6f; --quasi: #d98a00; --sforato: #d6333a;
    --bordo: 2.5px solid var(--inchiostro); --r: 18px; --ombra: 0 5px 0 var(--inchiostro);
    --nav-h: 74px;
    --titoli: "Fredoka", "Nunito", -apple-system, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; color: var(--inchiostro); font: 600 16px/1.4 "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-text-size-adjust: 100%; }
  body { background-color: var(--sfondo);
    background-image: radial-gradient(rgba(43,39,53,.07) 1px, transparent 1.4px), radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.4px);
    background-size: 16px 16px, 24px 24px; background-position: 0 0, 8px 12px; min-height: 100vh; }
  h1, h2, .num, .grosso, button, .btn { font-family: var(--titoli); }
  h1 { font-size: 26px; font-weight: 700; margin: 0; }
  h2 { font-size: 19px; font-weight: 700; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
  h2 small { font: 700 13px "Nunito", sans-serif; color: var(--tenue); margin-left: auto; }
  a { color: var(--risparmio); }
  button { color: inherit; font-size: inherit; cursor: pointer; }
  .nascosto { display: none !important; }
  .tenue { color: var(--tenue); }
  .centro { text-align: center; }

  /* ── HUD in alto ── */
  #testa { position: sticky; top: 0; z-index: 9; background: var(--foglio); border-bottom: var(--bordo);
    padding: calc(8px + env(safe-area-inset-top)) 16px 8px; }
  #testa:empty { display: none; }
  #testa::after { content: ''; position: absolute; left: 0; right: 0; bottom: -11px; height: 9px;
    background: linear-gradient(-45deg, transparent 6px, var(--inchiostro) 0) 0 0 / 12px 9px repeat-x,
                linear-gradient(45deg, transparent 6px, var(--inchiostro) 0) 0 0 / 12px 9px repeat-x; opacity: .9; }
  .hud { display: flex; align-items: center; gap: 10px; max-width: 620px; margin: 0 auto; }
  .stella { width: 46px; height: 46px; flex: none; border: var(--bordo); border-radius: 50%; background: var(--sole);
    box-shadow: 0 3px 0 var(--inchiostro); display: grid; place-items: center; font: 700 19px var(--titoli); position: relative; }
  .stella::before { content: '★'; position: absolute; top: -9px; right: -6px; font-size: 18px; color: var(--sole2);
    text-shadow: 0 0 0 var(--inchiostro), 1px 1px 0 var(--inchiostro), -1px -1px 0 var(--inchiostro), 1px -1px 0 var(--inchiostro), -1px 1px 0 var(--inchiostro); }
  .xp { flex: 1; min-width: 0; }
  .xp small { display: block; font-size: 12px; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xp-barra { height: 14px; border: var(--bordo); border-radius: 10px; background: var(--foglio2); overflow: hidden; }
  .xp-barra i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--sole) 0 8px, var(--sole2) 8px 16px);
    border-right: 2px solid var(--inchiostro); }
  .pill { flex: none; border: var(--bordo); border-radius: 30px; padding: 4px 10px; background: var(--foglio2);
    box-shadow: 0 3px 0 var(--inchiostro); font: 700 15px var(--titoli); white-space: nowrap; }
  .pill.neg { color: var(--sforato); }

  /* ── Contenuto ── */
  #app { max-width: 620px; margin: 0 auto; padding: 22px 16px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom)); }
  .foglio { position: relative; background: var(--foglio); border: var(--bordo); border-radius: var(--r); box-shadow: var(--ombra);
    padding: 14px 16px; margin-bottom: 16px; }
  /* fogli sotto: z-index negativo SENZA stacking context sulla .pila, così restano dietro al foglio bianco */
  .pila::before, .pila::after { content: ''; position: absolute; inset: 0; border: var(--bordo); border-radius: var(--r); z-index: -1; }
  .pila::before { background: #f7cf8b; transform: rotate(2.4deg) translate(5px, 9px); }
  .pila::after { background: #9fd3c0; transform: rotate(-2deg) translate(-5px, 14px); z-index: -2; }
  html, body { overflow-x: hidden; }
  .storto { transform: rotate(-.7deg); }

  .mesi { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  .mesi h1 { text-align: center; flex: 1; }
  .tondo { width: 44px; height: 44px; flex: none; border: var(--bordo); border-radius: 50%; background: var(--foglio);
    box-shadow: 0 3px 0 var(--inchiostro); font-size: 17px; }
  .tondo:active, .btn:active, .tile:active, .chip:active, .riga:active, .cat-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--inchiostro); }

  .saldo { text-align: center; padding: 18px 16px 16px; }
  .saldo small { font-size: 14px; color: var(--tenue); text-transform: uppercase; letter-spacing: .08em; }
  .grosso { font-size: 42px; font-weight: 700; line-height: 1.1; margin: 2px 0 14px; letter-spacing: -.01em; }
  .grosso.neg { color: var(--sforato); }
  .mese-ora { padding: 12px 16px; margin-top: 22px; }
  .scad th:nth-child(2), .scad td:nth-child(2) { text-align: left; }
  .scad td:first-child { white-space: normal; }
  .avviso-tasse { display: block; width: 100%; text-align: left; font: 600 15px "Nunito", sans-serif; background: #fff3c4; padding: 12px 14px; margin-top: 4px; }
  .mese-testa { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 700 17px var(--titoli); }
  .mese-testa .pos { color: var(--entrata); } .mese-testa .neg { color: var(--sforato); }
  .mese-righe { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--tenue); margin-top: 6px; }
  .mese-ora p { margin-top: 8px !important; }
  .tre { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tre > div { background: var(--foglio2); border: 2px solid var(--inchiostro); border-radius: 12px; padding: 8px 4px; font-size: 12px; color: var(--tenue); }
  .tre b { display: block; font: 700 16px var(--titoli); color: var(--inchiostro); margin-top: 2px; white-space: nowrap; }
  .pallino { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--inchiostro); margin-right: 4px; vertical-align: -1px; }
  .pallino.entrata { background: var(--entrata); } .pallino.spesa { background: var(--spesa); } .pallino.risparmio { background: var(--risparmio); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: var(--bordo); border-radius: 14px;
    background: var(--sole); box-shadow: 0 4px 0 var(--inchiostro); padding: 12px 16px; font-size: 18px; font-weight: 600; text-decoration: none; color: var(--inchiostro); }
  .btn.spesa { background: var(--spesa); color: #fff; } .btn.entrata { background: var(--entrata); color: #fff; }
  .btn.chiaro { background: var(--foglio); } .btn.piccolo { padding: 8px 12px; font-size: 15px; border-radius: 12px; }
  .btn.pieno { width: 100%; }
  .btn.pericolo { background: #fff; color: var(--sforato); }
  .due-btn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 26px 0 4px; }
  .due-btn .btn { font-size: 20px; padding: 14px 10px; }

  /* ── Budget: barra della vita ── */
  .griglia-budget { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .cat-card { text-align: left; border: var(--bordo); border-radius: 16px; background: var(--foglio); box-shadow: 0 4px 0 var(--inchiostro);
    padding: 10px 10px 9px; font-family: "Nunito", sans-serif; display: block; width: 100%; }
  .cat-card .testa-c { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; min-width: 0; }
  .emo { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 2px solid var(--inchiostro); border-radius: 10px;
    font-size: 19px; filter: drop-shadow(0 2px 0 rgba(43,39,53,.35)); }
  .cat-card b { font: 600 15px var(--titoli); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .cat-card small { display: block; font-size: 12px; color: var(--tenue); white-space: nowrap; }
  .vita { position: relative; height: 13px; border: 2px solid var(--inchiostro); border-radius: 8px; background: var(--foglio2); overflow: hidden; }
  .vita i { position: absolute; left: 0; top: 0; bottom: 0; border-right: 2px solid var(--inchiostro); }
  .vita i.ok { background: var(--ok); } .vita i.quasi { background: var(--sole2); } .vita i.sforato { background: var(--sforato); }
  .vita .oggi { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2px dashed var(--inchiostro); opacity: .55; }
  .stato { font: 800 11px "Nunito", sans-serif; text-transform: uppercase; letter-spacing: .04em; margin-top: 5px; display: flex; justify-content: space-between; gap: 4px; }
  .stato.ok { color: var(--ok); } .stato.quasi { color: #a86a00; } .stato.sforato { color: var(--sforato); }
  .stato { display: block; }
  .stato span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stato span:last-child { color: var(--tenue); text-transform: none; letter-spacing: 0; font-weight: 700; margin-top: 1px; }

  /* ── Elenco movimenti ── */
  .lista { padding: 4px 0; }
  .riga { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-bottom: 2px dashed rgba(43,39,53,.15);
    background: none; text-align: left; font-family: "Nunito", sans-serif; }
  .riga:last-child { border-bottom: 0; }
  .riga:active { box-shadow: none; background: var(--foglio2); }
  .riga-testo { flex: 1; min-width: 0; }
  .riga-testo b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-testo small { display: block; font-size: 12px; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .imp { font: 700 16px var(--titoli); white-space: nowrap; }
  .imp.entrata { color: var(--entrata); } .imp.spesa { color: var(--spesa); } .imp.risparmio { color: var(--risparmio); }
  .gruppo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 22px 4px 8px; font: 700 17px var(--titoli); }
  .gruppo small { font: 700 12px "Nunito", sans-serif; color: var(--tenue); text-align: right; }
  .vuoto { padding: 22px 16px; text-align: center; color: var(--tenue); }

  .filtri { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { border: 2px solid var(--inchiostro); border-radius: 30px; background: var(--foglio); padding: 6px 12px; font: 600 14px var(--titoli);
    box-shadow: 0 3px 0 var(--inchiostro); white-space: nowrap; }
  .chip.su { background: var(--inchiostro); color: var(--foglio); }
  .campo { width: 100%; border: var(--bordo); border-radius: 14px; background: var(--foglio); padding: 11px 13px; font: 600 16px "Nunito", sans-serif;
    color: var(--inchiostro); box-shadow: inset 0 3px 0 rgba(43,39,53,.08); -webkit-appearance: none; appearance: none; }
  select.campo { background-image: linear-gradient(45deg, transparent 50%, var(--inchiostro) 50%), linear-gradient(135deg, var(--inchiostro) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 30px; }
  .due { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  label.et { display: block; font-size: 13px; color: var(--tenue); margin: 14px 2px 5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }

  /* ── Report ── */
  .statistiche { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .stat { border: var(--bordo); border-radius: 16px; background: var(--foglio); box-shadow: 0 4px 0 var(--inchiostro); padding: 11px 12px; }
  .stat small { font-size: 12px; color: var(--tenue); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  .stat .num { font-size: 23px; font-weight: 700; display: block; white-space: nowrap; }
  .stat .sotto { font-size: 12px; color: var(--tenue); }
  .stat .neg { color: var(--sforato); }
  .grafico { display: flex; align-items: flex-end; gap: 4px; height: 170px; padding: 0 2px; border-bottom: 2px solid var(--inchiostro); position: relative; }
  .colonna { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; border: 0; background: none; padding: 0; position: relative; }
  .colonna.sel::before { content: ''; position: absolute; inset: -4px -2px -2px; background: rgba(255,201,60,.35); border-radius: 8px; }
  .barra { width: 44%; max-width: 14px; border-radius: 4px 4px 0 0; position: relative; min-height: 0; }
  .barra.entrata { background: var(--entrata); } .barra.spesa { background: var(--spesa); }
  .assex { display: flex; gap: 4px; padding: 4px 2px 0; }
  .assex span { flex: 1; text-align: center; font-size: 11px; color: var(--tenue); font-weight: 800; }
  .legenda { display: flex; gap: 14px; font-size: 13px; color: var(--tenue); margin-bottom: 10px; flex-wrap: wrap; }
  .lettura { margin-top: 12px; background: var(--foglio2); border: 2px solid var(--inchiostro); border-radius: 12px; padding: 9px 12px; font-size: 14px; }
  .lettura b { font-family: var(--titoli); }
  .hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; border: 0; background: none;
    padding: 7px 0; text-align: left; font-family: "Nunito", sans-serif; }
  .hbar .nome { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar .val { font: 700 14px var(--titoli); text-align: right; white-space: nowrap; }
  .hbar .val small { font: 700 11px "Nunito", sans-serif; color: var(--tenue); margin-left: 4px; }
  .hbar .traccia { grid-column: 1 / -1; height: 12px; border-radius: 6px; background: rgba(43,39,53,.08); }
  .hbar .traccia i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
  .tabella { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabella th, .tabella td { padding: 7px 6px; text-align: right; border-bottom: 2px dashed rgba(43,39,53,.15); white-space: nowrap; }
  .tabella th:first-child, .tabella td:first-child { text-align: left; }
  .tabella th { font: 700 12px "Nunito", sans-serif; color: var(--tenue); text-transform: uppercase; }
  .scorre { overflow-x: auto; }
  .confronto { font-size: 14px; margin-top: 10px; }
  .su-giu { font-weight: 800; }

  /* ── Barra in basso ── */
  #barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--foglio); border-top: var(--bordo);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  #barra:empty { display: none; }
  .voci { display: grid; grid-template-columns: 1fr 1fr 82px 1fr 1fr; align-items: end; max-width: 620px; margin: 0 auto; height: 60px; }
  .voce { border: 0; background: none; font: 600 12px var(--titoli); display: flex; flex-direction: column; align-items: center; gap: 1px;
    color: var(--tenue); padding: 4px 0; }
  .voce span { font-size: 23px; line-height: 1.1; filter: grayscale(.6); opacity: .75; }
  .voce.su { color: var(--inchiostro); }
  .voce.su span { filter: none; opacity: 1; transform: translateY(-2px) scale(1.12); }
  .piu { justify-self: center; align-self: end; width: 70px; height: 70px; margin-bottom: 8px; margin-top: -26px; border: 3px solid var(--inchiostro); border-radius: 50%;
    background: var(--spesa); color: #fff; font: 700 40px/1 var(--titoli); box-shadow: 0 5px 0 var(--inchiostro); padding-bottom: 4px; }
  .piu:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--inchiostro); }

  /* ── Popup (foglio che sale dal basso) ── */
  #modale { position: fixed; inset: 0; z-index: 20; background: rgba(43,39,53,.45); display: flex; align-items: flex-end; justify-content: center; }
  .scheda { width: 100%; max-width: 620px; max-height: 94vh; overflow-y: auto; background: var(--foglio); border: var(--bordo); border-bottom: 0;
    border-radius: 24px 24px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -5px 0 rgba(43,39,53,.25); }
  .scheda.piccola { border-radius: 24px; border-bottom: var(--bordo); margin: 0 12px 24px; max-width: 440px; }
  .scheda h1 { font-size: 22px; margin-bottom: 4px; }
  .linguette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 14px; }
  .linguetta { border: var(--bordo); border-radius: 14px; background: var(--foglio2); padding: 9px 4px; font: 600 15px var(--titoli); box-shadow: 0 3px 0 var(--inchiostro); }
  .linguetta.su.spesa { background: var(--spesa); color: #fff; } .linguetta.su.entrata { background: var(--entrata); color: #fff; }
  .linguetta.su.risparmio { background: var(--risparmio); color: #fff; }
  .importo { display: flex; align-items: center; border: 3px solid var(--inchiostro); border-radius: 18px; background: #fff; padding: 4px 14px;
    box-shadow: inset 0 4px 0 rgba(43,39,53,.08); }
  .importo span { font: 700 30px var(--titoli); color: var(--tenue); }
  .importo input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 700 40px var(--titoli); color: var(--inchiostro); padding: 4px 8px; }
  .calcolo { font-size: 14px; color: var(--tenue); margin: 6px 4px 0; min-height: 20px; }
  .calcolo b { color: var(--inchiostro); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .tile { border: 2px solid var(--inchiostro); border-radius: 14px; padding: 8px 2px 6px; box-shadow: 0 3px 0 var(--inchiostro);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font: 600 12px var(--titoli); min-width: 0; }
  .tile span { font-size: 25px; line-height: 1.1; filter: drop-shadow(0 2px 0 rgba(43,39,53,.3)); }
  .tile em { font-style: normal; font-size: 11.5px; letter-spacing: -.01em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 3px; }
  .tile.su { outline: 3px solid var(--inchiostro); outline-offset: 2px; transform: translateY(-2px) rotate(-2deg); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip.sugg { box-shadow: none; background: var(--foglio2); font-size: 13px; padding: 5px 10px; }
  .azioni { display: flex; gap: 10px; margin-top: 20px; }
  .azioni .btn { flex: 1; }

  #avviso { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 26px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
    max-width: calc(100% - 32px); background: var(--inchiostro); color: var(--foglio); border-radius: 14px; padding: 10px 16px; font: 600 15px var(--titoli);
    box-shadow: 0 4px 0 rgba(43,39,53,.35); text-align: center; }
  #avviso.errore { background: var(--sforato); color: #fff; }
  #avviso:empty { display: none; }

  .login { max-width: 360px; margin: 9vh auto 0; text-align: center; }
  .porcellino { font-size: 84px; line-height: 1; filter: drop-shadow(0 5px 0 rgba(43,39,53,.35)); display: inline-block; transform: rotate(-6deg); }
  .login .campo { text-align: center; font: 700 26px var(--titoli); letter-spacing: .3em; margin-top: 10px; }
  .caricamento { text-align: center; margin-top: 30vh; font: 600 20px var(--titoli); }
  .caricamento span { display: inline-block; font-size: 54px; animation: salta .9s ease-in-out infinite alternate; }
  @keyframes salta { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-16px) rotate(8deg); } }
  .cat-riga { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 2px dashed rgba(43,39,53,.15); background: none;
    padding: 9px 0; text-align: left; font-family: "Nunito", sans-serif; }
  .cat-riga:last-child { border-bottom: 0; }
  .cat-riga b { flex: 1; }
  .novita { margin: 0; padding-left: 18px; font-size: 14px; }
  .novita li { margin-bottom: 6px; }
  @media (prefers-reduced-motion: reduce) { .caricamento span { animation: none; } }
</style>

// doGet() sostituisce la stringa segnaposto con i dati pubblici (Apps Script toglie i commenti, le stringhe no)
// ─── Fuori da Google (sito su GitHub Pages): google.script.run imitato con fetch() verso la web app ───
// Solo qui funziona il Face ID: dentro Google la pagina sta in un iframe che non permette le passkey.
var API_URL = 'https://script.google.com/macros/s/AKfycbxs8ZRALYrbXjhZzkSmruhN--EP6LfToEThWeQxFBoCvud517g-w6lHe0CkRDXX9mbVzg/exec';
var google; // dentro Apps Script c'è già (ridichiararla non la cambia); fuori la crea il blocco qui sotto
var FUORI = !google || !google.script;
if (FUORI) {
  var chiamaApi = function (ok, ko) {
    var r = {
      withSuccessHandler: function (f) { return chiamaApi(f, ko); },
      withFailureHandler: function (f) { return chiamaApi(ok, f); }
    };
    ['getDati', 'accedi', 'azione', 'sfidaPasskey', 'accediPasskey'].forEach(function (fn) {
      r[fn] = function () {
        var args = Array.prototype.slice.call(arguments);
        // le letture si ritentano da sole; i salvataggi no (potrebbero essere già andati a buon fine)
        var tentativi = fn === 'azione' ? 1 : 3;
        var prova = function () {
          tentativi--;
          fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
            .then(function (x) { return x.text(); })
            .then(function (t) {
              var j;
              try { j = JSON.parse(t); } catch (e) { throw new Error('risposta non valida da Google'); }
              if (j.ok) { if (ok) ok(j.r); } else if (ko) ko(new Error(j.e));
            })
            .catch(function (err) {
              if (tentativi > 0) return setTimeout(prova, 800);
              if (ko) ko(new Error((fn === 'azione' ? 'Non so se è stato salvato: ricarica e controlla. ' : 'Connessione non riuscita, riprova. ') + '(' + err.message + ')'));
            });
        };
        prova();
      };
    });
    return r;
  };
  google = window.google = { script: {} };
  Object.defineProperty(google.script, 'run', { get: function () { return chiamaApi(null, null); } });
}
// Fuori da Google la sessione resta solo finché l'app è aperta (sessionStorage): a ogni apertura si rientra col Face ID
function memoTok(v) {
  try {
    var st = FUORI ? window.sessionStorage : window.localStorage;
    if (!arguments.length) return st.getItem('finanze_tok');
    if (v == null) st.removeItem('finanze_tok'); else st.setItem('finanze_tok', v);
  } catch (e) { return null; }
}
function b64u(buf) {
  var b = new Uint8Array(buf), t = '';
  for (var i = 0; i < b.length; i++) t += String.fromCharCode(b[i]);
  return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function deb64u(x) {
  x = String(x).replace(/-/g, '+').replace(/_/g, '/');
  while (x.length % 4) x += '=';
  var t = atob(x), b = new Uint8Array(t.length);
  for (var i = 0; i < t.length; i++) b[i] = t.charCodeAt(i);
  return b;
}
var SFIDA = null, SFIDA_REG = null;
var SITO_URL = 'https://marco-galvani1992.github.io/finanze-app/';
var PUO_FACEID = FUORI && typeof window !== 'undefined' && !!window.PublicKeyCredential && !!(navigator.credentials && navigator.credentials.get);

var DATI = '__DATI_INIZIALI__';
if (DATI === '__DATI_INIZIALI__') DATI = null;

var MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
var MESI_C = ['G', 'F', 'M', 'A', 'M', 'G', 'L', 'A', 'S', 'O', 'N', 'D'];
// colori di carta delle categorie (fissi per posizione: il colore segue la categoria)
var PASTELLI = ['#ffd6a5', '#caffbf', '#ffadad', '#9bf6ff', '#bdb2ff', '#fdffb6', '#ffc6ff', '#a0c4ff', '#d0f4de', '#f1c0e8', '#ffe5b4', '#b9fbc0', '#e4c1f9', '#fbc4ab', '#c1e1ff'];
var NOMI_TIPO = { spesa: 'Spesa', entrata: 'Entrata', risparmio: 'Risparmio' };
var NOMI_MODO = { nero: '💵 Nero', fattura: '🧾 Fattura', ritenuta: '🎟️ Esibirsi' };
var XP_LIVELLO = 500;

var SESS = memoTok() || '';
var V = 'home';
var MESE = '', ANNO_R = '', MESE_R = -1;
var FILTRO = { tipo: '', cat: '', anno: '', mese: '', q: '', quanti: 150 };
var MOV = [], CAT = [], CATI = {}, FISSE = [], BOZZA_F = null, CHIAVE_SIRI = '', BOZZA_F24 = null;
var MODALE = null, BOZZA_M = null, BOZZA_C = null, SUGG = [], alOk = null;
var occupato = false, CODA = [], N_TEMP = 0, timerAvviso = null;

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function memo(k, v) {
  try {
    if (arguments.length === 1) return window.localStorage.getItem(k);
    if (v == null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function normTxt(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
function num(v) {
  var s = String(v == null ? '' : v).replace(/[€\s]/g, '');
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); // "2.850" = duemilaottocentocinquanta
  var n = Number(s);
  return isFinite(n) ? n : 0;
}
function tondo(n) { return Math.round(n * 100) / 100; }
// "1.792,87 €" (toLocaleString in italiano non mette il punto sotto i 10.000)
function euro(n, intero) {
  var v = intero ? Math.round(n) : tondo(n);
  var neg = v < 0, p = (intero ? String(Math.abs(v)) : Math.abs(v).toFixed(2)).split('.');
  return (neg ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '') + ' €';
}
function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function nomeMese(ym) { return MESI[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4); }
function dataBreve(m) {
  // lo storico dal 2023 non ha il giorno: si mostra solo il mese
  if (!m.app && !m.fissa && m.data.slice(8) === '01' && m.data >= '2023') return MESI[Number(m.data.slice(5, 7)) - 1].slice(0, 3).toLowerCase() + ' ' + m.data.slice(0, 4);
  var p = m.data.split('-');
  return Number(p[2]) + ' ' + MESI[Number(p[1]) - 1].slice(0, 3).toLowerCase() + (p[0] !== DATI.oggi.slice(0, 4) ? ' ' + p[0] : '');
}
function cat(id) { return CATI[id] || { id: id, nome: id || '?', emoji: '•', colore: '#eee', tipo: '' }; }
function catDi(tipo, tutte) { return CAT.filter(function (c) { return c.tipo === tipo && (tutte || c.attivo !== 'No'); }); }

// ─── Conti ───────────────────────────────────────────────────────────────────

function totali(lista) {
  var t = { entrata: 0, spesa: 0, risparmio: 0, tasse: 0 };
  lista.forEach(function (m) {
    t[m.tipo] = (t[m.tipo] || 0) + m.importo;
    if (m.tipo === 'entrata' && m.modo === 'fattura' && m.lordo) t.tasse += tasseFattura(m.lordo);
  });
  t.rimasto = t.entrata - t.spesa - t.risparmio;
  return t;
}
function delMese(ym) { return MOV.filter(function (m) { return m.data.slice(0, 7) === ym; }); }
function dellAnno(a) { return MOV.filter(function (m) { return m.data.slice(0, 4) === a; }); }
function mesiPassati(a) {
  var oa = DATI.oggi.slice(0, 4);
  return a < oa ? 12 : a > oa ? 1 : Number(DATI.oggi.slice(5, 7));
}
function anniConDati() {
  var s = {};
  MOV.forEach(function (m) { s[m.data.slice(0, 4)] = 1; });
  s[DATI.oggi.slice(0, 4)] = 1;
  return Object.keys(s).sort().reverse();
}
/** Netto e lordo come li calcola il server (fattura: netto = lordo × coeff; Esibirsi: fatturato = netto / coeff, Verona a parte). */
function calcola(b) {
  var k = DATI.coeff || { fattura: 0.71, esibirsi: 0.7449, esibirsiVr: 0.7005 };
  if (b.tipo !== 'entrata' || b.modo === 'nero' || !b.modo) return { importo: tondo(b.importo), lordo: '' };
  if (b.modo === 'fattura') return { importo: tondo(b.lordo * k.fattura), lordo: tondo(b.lordo) };
  return { importo: tondo(b.importo), lordo: tondo(b.importo / (b.verona ? k.esibirsiVr : k.esibirsi)) };
}

// Livello: +100 XP per ogni mese chiuso in attivo (entrate > spese), +10 XP per ogni movimento segnato dall'app
function livello() {
  var mesi = {}, app = 0, oggiM = DATI.oggi.slice(0, 7);
  MOV.forEach(function (m) {
    var k = m.data.slice(0, 7), t = mesi[k] || (mesi[k] = { e: 0, s: 0 });
    if (m.tipo === 'entrata') t.e += m.importo;
    if (m.tipo === 'spesa') t.s += m.importo;
    if (m.app) app++;
  });
  var verdi = Object.keys(mesi).filter(function (k) { return k < oggiM && mesi[k].e > mesi[k].s; }).length;
  var xp = verdi * 100 + app * 10;
  return { liv: 1 + Math.floor(xp / XP_LIVELLO), xp: xp, resto: xp % XP_LIVELLO, verdi: verdi, app: app };
}
// giorni di fila (fino a oggi o ieri) con almeno un movimento segnato dall'app
function serie() {
  var g = {};
  MOV.forEach(function (m) { if (m.app) g[m.data] = 1; });
  var d = new Date(DATI.oggi + 'T12:00:00');
  if (!g[iso(d)]) d.setDate(d.getDate() - 1);
  var n = 0;
  while (g[iso(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ─── Dati dal server ─────────────────────────────────────────────────────────

function riceviDati(d) {
  DATI = d;
  if (d.login) { if (SESS) { SESS = ''; memoTok(null); } return; }
  MOV = (d.movimenti || []).map(function (a) {
    return { id: a[0], data: a[1], tipo: a[2], cat: a[3], sotto: a[4] || '', causale: a[5] || '', importo: Number(a[6]) || 0,
      modo: a[7] || '', lordo: a[8] === '' ? '' : Number(a[8]), app: a[9] === 1, fissa: a[9] === 2 };
  });
  FISSE = (d.fisse || []).slice().sort(function (a, b) { return Number(a.giorno) - Number(b.giorno) || (a.causale < b.causale ? -1 : 1); });
  CAT = (d.categorie || []).slice().sort(function (a, b) { return Number(a.ordine) - Number(b.ordine); });
  CATI = {};
  CAT.forEach(function (c, i) { c.colore = PASTELLI[i % PASTELLI.length]; CATI[c.id] = c; });
  if (!MESE) MESE = d.oggi.slice(0, 7);
  if (!ANNO_R) ANNO_R = d.oggi.slice(0, 4);
}

function ricarica() {
  google.script.run
    .withSuccessHandler(function (d) { riceviDati(d); disegna(); })
    .withFailureHandler(suErrore)
    .getDati(SESS);
}

/** Scrive sul server. Con `ottimista` (ripetibile) la pagina mostra subito la modifica; le scritture dopo vanno in CODA. */
function scrivi(nome, args, dopo, ottimista, seErrore) {
  var x = { nome: nome, args: args, dopo: dopo, ottimista: ottimista, seErrore: seErrore };
  if (occupato) {
    if (!ottimista) return avviso('Aspetta un attimo: sto ancora salvando…');
    CODA.push(x); ottimista(); disegna();
    return;
  }
  if (ottimista) { ottimista(); disegna(); }
  avvia(x);
}
function avvia(x) {
  occupato = true;
  avviso(x.nome === 'importaStorico' ? '📚 Rileggo lo storico: ci vuole un minuto…' : x.ottimista ? '☁️ Salvo…' : 'Salvataggio…', false, 0);
  google.script.run
    .withSuccessHandler(function (d) {
      occupato = false;
      // risposta leggera (salvataggi dei movimenti): la pagina tiene i suoi dati, già aggiornati in modo ottimista
      if (!d.leggero) {
        riceviDati(d);
        CODA.forEach(function (y) { if (y.ottimista) y.ottimista(); });
      }
      var prossimo = CODA.shift();
      if (!prossimo) avviso('');
      if (d.avviso) avviso(d.avviso, /^⚠/.test(d.avviso), 9000);
      if (x.dopo) x.dopo(d); else disegna();
      if (prossimo) avvia(prossimo);
    })
    .withFailureHandler(function (err) {
      var falliti = [x].concat(CODA);
      CODA = [];
      occupato = false;
      suErrore(err);
      falliti.forEach(function (y) { if (y.seErrore) y.seErrore(); });
      if (x.ottimista) ricarica();
    })
    .azione(SESS, x.nome, x.args);
}
function idTemporaneo() { return 'tmp' + Date.now().toString(36) + (++N_TEMP); }

function suErrore(err) {
  occupato = false;
  var msg = String(err && err.message || err);
  if (/SESSIONE/.test(msg)) { SESS = ''; memoTok(null); DATI = { login: true, haPin: true }; chiudiModale(); disegna(); }
  avviso('⚠ ' + msg.replace(/^Error:\s*/, ''), true, 9000);
}

function avviso(testo, errore, ms) {
  var el = $('avviso');
  el.textContent = testo || '';
  el.className = errore ? 'errore' : '';
  clearTimeout(timerAvviso);
  if (testo && ms !== 0) timerAvviso = setTimeout(function () { el.textContent = ''; }, ms || 3500);
}

// ─── Disegno ─────────────────────────────────────────────────────────────────

function disegna() {
  if (!DATI) {
    $('testa').innerHTML = ''; $('barra').innerHTML = '';
    $('app').innerHTML = '<div class="caricamento"><span>🪙</span><br>Conto le monete…</div>';
    return;
  }
  if (DATI.login) { $('testa').innerHTML = ''; $('barra').innerHTML = ''; $('app').innerHTML = loginHtml(); return; }
  $('testa').innerHTML = hudHtml();
  $('barra').innerHTML = barraHtml();
  var f = { home: homeHtml, movimenti: movimentiHtml, report: reportHtml, altro: altroHtml }[V] || homeHtml;
  $('app').innerHTML = f();
}
function vai(v) { V = v; disegna(); if (window.scrollTo) window.scrollTo(0, 0); }

function caricaSfida() {
  google.script.run.withSuccessHandler(function (x) { SFIDA = x; }).withFailureHandler(function () { SFIDA = null; }).sfidaPasskey();
}

function faceIdHtml() {
  var h = '<h2>🔐 Face ID</h2><div class="foglio">';
  if (!FUORI) {
    return h + '<p style="margin:0">Il Face ID funziona solo dall\'app nuova, fuori da Google: <a target="_blank" href="' + esc(SITO_URL) + '">' + esc(SITO_URL.replace('https://', '')) + '</a>. ' +
      'Aprila in Safari, entra col PIN, attiva il Face ID e aggiungila alla schermata Home al posto di questa.</p></div>';
  }
  if (!PUO_FACEID) return h + '<p class="tenue" style="margin:0">Questo browser non supporta il Face ID.</p></div>';
  var pk = DATI.passkeys || [];
  h += pk.length ? '<p style="margin:0">Attivo su: ' + pk.map(function (k) { return '<b>' + esc(k.nome) + '</b> <span class="tenue">(' + esc(String(k.creato).slice(0, 10).split('-').reverse().join('/')) + ')</span> ' +
    '<button class="chip sugg" data-az="togliFaceId" data-id="' + esc(k.id) + '">togli</button>'; }).join(' · ') + '</p>'

  h += '<p class="tenue" style="font-size:12px;margin:8px 0 0">Ogni volta che riapri l\'app ti chiede il Face ID (o il PIN).</p>';

function hudHtml() {
  var l = livello(), s = serie(), t = media12(DATI.oggi.slice(0, 7));

function budgetAnnoDi(c) { return num(c.budgetAnno) || num(c.budget) * 12; }

/** Media al mese dei 12 mesi completi che finiscono col mese guardato (se è passato) o col mese prima (se è questo o futuro). */
function media12(ym) {
  var oggiM = DATI.oggi.slice(0, 7);
  var fine = ym < oggiM ? ym : meseSpostato(oggiM, -1), inizio = meseSpostato(fine, -11);
  var primo = MOV.reduce(function (x, m) { var k = m.data.slice(0, 7); return !x || k < x ? k : x; }, '');
  if (primo && primo > inizio) inizio = primo;
  var t = totali(MOV.filter(function (m) { var k = m.data.slice(0, 7); return k >= inizio && k <= fine; }));
  var n = Math.max(1, mesiTra(inizio, fine));
  var corto = function (k) { return MESI[Number(k.slice(5, 7)) - 1].slice(0, 3).toLowerCase() + ' ' + k.slice(0, 4); };
  return { entrata: t.entrata / n, spesa: t.spesa / n, risparmio: t.risparmio / n, rimasto: t.rimasto / n, mesi: n, periodo: corto(inizio) + ' – ' + corto(fine) };
}
function meseSpostato(ym, d) { var p = ym.split('-').map(Number), x = new Date(p[0], p[1] - 1 + d, 1); return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2); }

// ─── Tasse (forfettario) e dichiarato ────────────────────────────────────────
// Stima: INPS gestione separata 26,07% sul 78% del fatturato, imposta 15% sul 78% meno l'INPS.
// Scadenze: 30/6 saldo dell'anno prima + 1° acconto, 30/11 2° acconto (imposta 50% + 50%, INPS 40% + 40% dell'anno prima).
function tasseFattura(lordo) { var r = lordo * 0.78, inps = r * 0.2607; return inps + Math.max(0, 0.15 * (r - inps)); }
function fiscoAnno(a) {
  var x = { F: 0, R: 0, N: 0, dichNetto: 0 };
  MOV.forEach(function (m) {
    if (m.tipo !== 'entrata' || m.data.slice(0, 4) !== a) return;
    if (m.modo === 'fattura') { x.F += m.lordo || 0; x.dichNetto += m.importo; }
    else if (m.modo === 'ritenuta') { x.R += m.lordo || 0; x.dichNetto += m.importo; }
    else x.N += m.importo;
  });
  // totali veri dal commercialista (scheda Fisco) se ci sono; sennò stima: imposta sul 78% meno i contributi
  // versati nell'anno (≈ l'INPS dell'anno prima)
  var vero = (DATI.fisco || []).filter(function (f) { return f.anno === a; })[0];
  if (vero) { x.inps = num(vero.inps); x.imp = num(vero.imposta); x.vero = true; }
  else {
    var r = x.F * 0.78, prima = Number(a) > 2018 ? fiscoAnnoBase(String(Number(a) - 1)) : null;
    x.inps = r * 0.2607;
    x.imp = Math.max(0, 0.15 * (r - (prima ? prima.inps : x.inps)));
  }
  x.tasse = x.inps + x.imp;
  return x;
}
// solo l'INPS dell'anno (vero o stimato), senza ricorsione all'indietro
function fiscoAnnoBase(a) {
  var vero = (DATI.fisco || []).filter(function (f) { return f.anno === a; })[0];
  if (vero) return { inps: num(vero.inps), imp: num(vero.imposta) };
  var F = MOV.reduce(function (t, m) { return t + (m.tipo === 'entrata' && m.modo === 'fattura' && m.data.slice(0, 4) === a ? m.lordo || 0 : 0); }, 0);
  return { inps: F * 0.78 * 0.2607, imp: 0 };
}
function daVersare(f) { return num(f.imposta) + num(f.inps) - num(f.crediti); }
/** Prossime scadenze: gli F24 del commercialista non pagati, più le stime per le date che non hanno ancora un F24. */
function scadenzeTasse() {
  var oggi = DATI.oggi, a = Number(oggi.slice(0, 4)), out = [], f24 = DATI.f24 || [];
  var acconto = function (q) { return 0.5 * q.imp + 0.4 * q.inps; };
  f24.forEach(function (f) { if (f.pagato !== 'Sì') out.push({ data: f.scadenza, cosa: f.descrizione, importo: daVersare(f), f24: f }); });
  for (var y = a; y <= a + 1; y++) {
    var p1 = fiscoAnno(String(y - 1)), p2 = fiscoAnno(String(y - 2));
    var saldo = p1.tasse - (p2.imp + 0.8 * p2.inps);
    var stime = [{ data: y + '-06-30', cosa: 'saldo ' + (y - 1) + ' e 1° acconto ' + y, importo: Math.max(0, saldo) + acconto(p1), credito: Math.max(0, -saldo), parziale: !p1.vero && y - 1 === a },
      { data: y + '-11-30', cosa: '2° acconto ' + y, importo: acconto(p1), parziale: !p1.vero && y - 1 === a }];
    stime.forEach(function (st) { if (!f24.some(function (f) { return f.scadenza === st.data; })) out.push(st); });
  }
  return out.filter(function (x) { return x.data >= oggi; }).sort(function (x, y) { return x.data < y.data ? -1 : 1; }).slice(0, 2);
}
function dataLunga(d) { var p = d.split('-'); return Number(p[2]) + ' ' + MESI[Number(p[1]) - 1].toLowerCase() + ' ' + p[0]; }
function giorniA(d) { return Math.round((new Date(d + 'T12:00:00') - new Date(DATI.oggi + 'T12:00:00')) / 86400000); }

    : '<p style="margin:0" class="tenue">Nessuna fattura nel ' + ANNO_R + '.</p>';
  if (ANNO_R === oggiA) {

function causaliFrequenti(idCat) {
  var cont = {};
  MOV.forEach(function (m) {
    if (m.cat !== idCat || !m.causale) return;
    var n = normTxt(m.causale), x = cont[n] || (cont[n] = { t: m.causale.trim(), n: 0, u: '', s: '' });
    x.n++;
    if (m.data >= x.u) { x.u = m.data; x.s = m.sotto; }
  });
  return Object.keys(cont).map(function (k) { return cont[k]; })
    .sort(function (a, b) { return b.n - a.n || (a.u < b.u ? 1 : -1); }).slice(0, 8);
}

  salvaCat: function () {
    var c = { id: BOZZA_C.id, tipo: BOZZA_C.tipo, nome: $('c-nome').value.trim(), emoji: $('c-emoji').value.trim(), sotto: $('c-sotto').value,
      budgetAnno: $('c-budget').value.trim() ? String(num($('c-budget').value)) : '', attivo: $('c-attivo') && $('c-attivo').checked ? 'No' : 'Sì' };
    if (!c.nome) return avviso('Serve un nome', true);
    chiudiModale();
    scrivi('salvaCategoria', { c: c });
  },
  salvaTasse: function () { scrivi('impostaTasse', { fattura: $('t-f').value, esibirsi: $('t-e').value, esibirsiVr: $('t-v').value }); },
  mVerona: function () { leggiModulo(); BOZZA_M.verona = !BOZZA_M.verona; disegnaModale(); },
  importa: function () {
    chiedi('Rileggo tutti i fogli vecchi (dal 2019) e rimpiazzo i movimenti importati. Quelli segnati nell\'app restano. Procedo?', 'Rileggi', function () { scrivi('importaStorico', {}); });
  },
  rifaiFoglio: function () { scrivi('rifaiFoglio', {}); },
  apriRiserva: function () { apriModale('riserva'); },
  nuovoF24: function () { BOZZA_F24 = {}; apriModale('f24'); },
  salvaF24: function () {
    var f = { id: BOZZA_F24.id || '', scadenza: $('g-scad').value, descrizione: $('g-desc').value, imposta: num($('g-imp').value), inps: num($('g-inps').value), crediti: num($('g-cred').value) };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.scadenza)) return avviso('Scegli la scadenza', true);
    chiudiModale();
    scrivi('salvaF24', { f: f });
  },
  eliminaF24: function () { var id = BOZZA_F24.id; chiedi('Togliere questo F24?', 'Togli', function () { scrivi('eliminaF24', { id: id }); }); },
  pagaF24: function (d) {
    var f = (DATI.f24 || []).filter(function (x) { return x.id === d.id; })[0];
    if (!f) return;
    chiedi('Segno pagato l\'F24 del ' + dataLunga(f.scadenza) + ' (' + euro(daVersare(f)) + ')?' + (DATI.riserva && DATI.riserva.data ? ' Lo tolgo dalla riserva tasse.' : ''), 'Pagato ✅', function () { scrivi('pagaF24', { id: f.id }); });
  },
  apriFisco: function () { apriModale('fisco'); },
  salvaFisco: function () {
    var f = { anno: $('k-anno').value.trim(), imposta: num($('k-imp').value), inps: num($('k-inps').value), nota: 'dal commercialista' };
    if (!/^\d{4}$/.test(f.anno)) return avviso('Anno non valido', true);
    chiudiModale();
    scrivi('salvaFisco', { f: f });
  },
  salvaRiserva: function () {
    var v = $('r-val').value;
    if (!String(v).trim()) return avviso('Scrivi quanto hai nella riserva', true);
    chiudiModale();
    scrivi('impostaRiserva', { importo: num(v) });
  },
  cambiaObiettivo: function () {
    alOk = function () { var v = $('o-val') && $('o-val').value; if (v) scrivi('impostaObiettivo', { obiettivo: num(v) }); };
    apriModale({ html: '<div class="scheda piccola"><h1>📄 Obiettivo dichiarato</h1><p class="tenue" style="margin:0">Lordo all\'anno (fatture + Esibirsi).</p>' +
      '<div class="importo" style="margin-top:12px"><span>€</span><input id="o-val" inputmode="decimal" value="' + esc(String(DATI.obiettivo || 25000)) + '"></div>' +
      '<div class="azioni"><button class="btn chiaro" data-az="annulla">Annulla</button><button class="btn" data-az="okTieni">💾 Salva</button></div></div>' });
  },
  okTieni: function () { var fn = alOk; alOk = null; if (fn) fn(); chiudiModale(); },
  chiaveSiri: function () {
    chiedi(DATI.siri ? 'Creo una chiave nuova? Quella vecchia smette di funzionare e va cambiata nel Comando rapido.' : 'Attivo Siri e creo la chiave segreta per il Comando rapido?', 'Sì', function () {
      scrivi('creaChiaveSiri', {}, function (d) { CHIAVE_SIRI = d.chiaveSiri || ''; disegna(); });
    });
  },
  togliSiri: function () { chiedi('Disattivo Siri? Il Comando rapido smette di funzionare.', 'Disattiva', function () { CHIAVE_SIRI = ''; scrivi('togliChiaveSiri', {}); }); },
  apriFissa: function (d) {
    var f = FISSE.filter(function (x) { return x.id === d.id; })[0];
    if (!f) return;
    BOZZA_F = Object.assign({}, f); apriModale('fissa');
  },
  nuovaFissa: function () {
    var c = catDi('spesa').filter(function (x) { return x.id === 'abbonamenti'; })[0] || catDi('spesa')[0];
    BOZZA_F = { id: '', tipo: 'spesa', categoria: c ? c.id : '', sotto: '', causale: '', importo: 0, giorno: '1', attiva: 'Sì' };
    apriModale('fissa');
  },
  fTipo: function (d) {
    leggiFissa();
    if (BOZZA_F.tipo === d.t) return;
    BOZZA_F.tipo = d.t; BOZZA_F.sotto = '';
    var c = catDi(d.t)[0]; BOZZA_F.categoria = c ? c.id : '';
    disegnaModale();
  },
  salvaFissa: function () {
    leggiFissa();
    var f = BOZZA_F;
    if (!f.importo) return avviso('Scrivi l\'importo', true);
    if (!(Number(f.giorno) >= 1 && Number(f.giorno) <= 28)) return avviso('Il giorno va da 1 a 28', true);
    var copia = Object.assign({}, f);
    chiudiModale();
    scrivi('salvaFissa', { f: { id: f.id, tipo: f.tipo, categoria: f.categoria, sotto: f.sotto, causale: f.causale.trim(), importo: f.importo, giorno: Number(f.giorno), attiva: f.attiva } },
      null, null, function () { BOZZA_F = copia; apriModale('fissa'); });
  },
  eliminaFissa: function () {
    var id = BOZZA_F.id;
    chiedi('Togliere questa spesa fissa? Quelle già segnate restano.', 'Togli 🗑️', function () { scrivi('eliminaFissa', { id: id }); });
  },
  ricarica: ricarica
};

document.addEventListener('click', function (e) {
  var el = e.target && e.target.closest ? e.target.closest('[data-vai],[data-az]') : null;
  if (!el) {
    // tocco sullo sfondo scuro del popup = chiudi (non sulla conferma)
    if (e.target && e.target.id === 'modale' && MODALE === 'cat') chiudiModale();
    return;
  }
  if (el.dataset.vai) return vai(el.dataset.vai);
  var fn = COMANDI[el.dataset.az];
  if (fn) fn(el.dataset);
});
document.addEventListener('input', function (e) {
  var id = e.target && e.target.id;
  if (id === 'cerca') { FILTRO.q = e.target.value; FILTRO.quanti = 150; $('lista').innerHTML = listaHtml(); }
  if (id === 'm-importo' && BOZZA_M) { leggiModulo(); $('m-calc').innerHTML = calcoloHtml(); }
});
document.addEventListener('change', function (e) {
  var id = e.target && e.target.id;
  if (id === 'f-anno') { FILTRO.anno = e.target.value; FILTRO.quanti = 150; disegna(); }
  if (id === 'fs-cat') { leggiFissa(); BOZZA_F.sotto = ''; disegnaModale(); return; }
  if (id === 'f-cat') { FILTRO.cat = e.target.value; FILTRO.quanti = 150; disegna(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && (e.target.id === 'pin' || e.target.id === 'pin2')) COMANDI.entra();
});
// tornando sull'app (telefono) si ricaricano i dati
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && SESS && DATI && !DATI.login && !occupato && !MODALE) ricarica();
});
setInterval(function () {
  if (occupato || MODALE || !SESS || !DATI || DATI.login) return;
  ricarica();
}, 120000);

// Avvio: con il token salvato si chiedono i dati veri, sennò basta il login
if (SESS) { DATI = null; disegna(); ricarica(); } else if (DATI) { riceviDati(DATI); disegna(); } else { disegna(); ricarica(); }
</script>
</body>
</html>
